craft-applications = [
    "charmcraft",
    "imagecraft",
    "rockcraft",
    "snapcraft",
    "debcraft",
]

craft-libraries = [
    "craft-application",
    "craft-archives",
    "craft-cli",
    "craft-grammar",
    "craft-parts",
    "craft-platforms",
    "craft-providers",
    "craft-store",
]

craft-projects = [
    "charmcraft",
    "imagecraft",
    "rockcraft",
    "snapcraft",
    "debcraft",
    "craft-application",
    "craft-archives",
    "craft-cli",
    "craft-grammar",
    "craft-parts",
    "craft-platforms",
    "craft-providers",
    "craft-store",
    "craft-actions",
    "craft-artifacts",
    "fetch-service",
    "snapcraft-rocks",
    "starbase",
    "starflow",
]

# snapcraft-rocks builds rock images that package multiple craft
# applications (notably snapcraft and rockcraft), so its round-1
# evaluation baseline should include every craft-application's repo, not
# just its own -- in addition to the craft-libraries every app already
# gets. See routes.eval_api._resolve_repo_shas.
craft-consumers = ["snapcraft-rocks"]

refresh-interval-days = 7

# Projects where open PRs should not be displayed on the dashboard
hide-prs = [
    "snapcraft (launchpad)",
]

# Projects where releases should not be displayed on the dashboard or cadence
hide-releases = [
    "snapcraft (launchpad)",
    "starbase",
    "snapcraft-rocks",
]

# Commit-scanner tuning (env-overridable via Settings):
# COMMIT_SCANNER_TOP_K = 10
# COMMIT_SCANNER_SIMILARITY_THRESHOLD = 0.70
# COMMIT_SCANNER_DAILY_INVALIDATION_WARN_THRESHOLD = 200

launchpad-projects = ["snapcraft"]

