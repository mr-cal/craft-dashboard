<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}craft-dashboard{% endblock %}</title>
    <link
      rel="stylesheet"
      href="https://assets.ubuntu.com/v1/vanilla_framework_version_4_44_0_min.css"
    />
    <link rel="stylesheet" href="/static/css/custom.css" />
    <script
      src="https://unpkg.com/htmx.org@2.0.4"
      integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+"
      crossorigin="anonymous"
    ></script>
    {% block head %}{% endblock %}
  </head>
  <body class="is-paper">
    <header id="navigation" class="p-navigation is-dark">
      <div class="p-navigation__row--25-75">
        <div class="p-navigation__banner">
          <div class="p-navigation__tagged-logo">
            <a class="p-navigation__link" href="/">
              <span class="p-navigation__logo-title">craft-dashboard</span>
            </a>
          </div>
          <ul class="p-navigation__items">
            <li class="p-navigation__item">
              <button class="js-menu-button p-navigation__link">Menu</button>
            </li>
          </ul>
        </div>
        <nav class="p-navigation__nav" aria-label="Main navigation">
          <ul class="p-navigation__items">
            <li class="p-navigation__item {% if request.url.path == '/' %}is-selected{% endif %}">
              <a class="p-navigation__link" href="/">Dashboard</a>
            </li>
            <li class="p-navigation__item {% if request.url.path.startswith('/issues') %}is-selected{% endif %}">
              <a class="p-navigation__link" href="/issues">Issues & PRs</a>
            </li>
            <li class="p-navigation__item {% if request.url.path.startswith('/stats') %}is-selected{% endif %}">
              <a class="p-navigation__link" href="/stats/trends">Stats</a>
            </li>
          </ul>
        </nav>
      </div>
    </header>
    <main class="l-main">
      {% block layout %}
      <div class="p-strip">
        <div class="row">
          <div class="col-12">
            {% block content %}{% endblock %}
          </div>
        </div>
      </div>
      {% endblock %}
    </main>
    <footer class="l-footer--sticky p-strip is-dark is-shallow">
      <div class="row">
        <a class="is-dark" href="https://github.com/mr-cal/craft-dashboard">craft-dashboard</a>
      </div>
    </footer>
    {% block scripts %}{% endblock %}
  </body>
</html>
