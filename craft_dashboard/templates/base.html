<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>{% block title %}craft-dashboard{% endblock %}</title>
    <script>
      (function () {
        var storedTheme = window.localStorage.getItem("theme");
        var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        var useDarkTheme = storedTheme === "dark" || (!storedTheme && prefersDark);
        document.documentElement.classList.toggle("is-dark-theme", useDarkTheme);
        document.documentElement.dataset.theme = useDarkTheme ? "dark" : "light";
      })();
    </script>
    <link
      rel="stylesheet"
      href="https://assets.ubuntu.com/v1/vanilla_framework_version_4_44_0_min.css"
    />
    <link rel="stylesheet" href="/static/css/custom.css" />
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico" />
    <script
      src="https://unpkg.com/htmx.org@2.0.4"
      integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+"
      crossorigin="anonymous"
    ></script>
    {% block head %}{% endblock %}
  </head>
  <body class="is-paper">
    <header id="navigation" class="p-navigation is-dark" role="banner">
      <div class="p-navigation__row--25-75">
        <div class="p-navigation__banner">
          <div class="p-navigation__tagged-logo">
            <a class="p-navigation__link" href="/">
              <span class="p-navigation__logo-title">craft-dashboard</span>
            </a>
          </div>
          <ul class="p-navigation__items" aria-label="Mobile menu">
            <li class="p-navigation__item">
              <button class="js-menu-button p-navigation__link">Menu</button>
            </li>
          </ul>
        </div>
        <nav class="p-navigation__nav" aria-label="Main navigation">
          <ul class="p-navigation__items">
            <li class="p-navigation__item {% if request.url.path == '/' %}is-selected{% endif %}">
              <a class="p-navigation__link" href="/">Dashboard</a>
            </li>
            <li class="p-navigation__item {% if request.url.path.startswith('/issues') %}is-selected{% endif %}">
              <a class="p-navigation__link" href="/issues">Issues & PRs</a>
            </li>
            <li class="p-navigation__item {% if request.url.path.startswith('/stats') %}is-selected{% endif %}">
              <a class="p-navigation__link" href="/stats/trends">Stats</a>
            </li>
          </ul>
          <ul class="p-navigation__items" style="margin-left: auto;">
            <li class="p-navigation__item p-navigation__item--theme-toggle">
              <button
                id="theme-toggle"
                class="p-navigation__link theme-toggle"
                type="button"
                aria-label="Switch to dark theme"
                aria-pressed="false"
              >
                <span class="theme-toggle__icon theme-toggle__icon--sun" aria-hidden="true">☀</span>
                <span class="theme-toggle__icon theme-toggle__icon--moon" aria-hidden="true">☾</span>
              </button>
            </li>
          </ul>
        </nav>
      </div>
    </header>
    <main class="l-main" role="main">
      {% block layout %}
      <div class="p-strip">
        <div class="row">
          <div class="col-12">
            {% block content %}{% endblock %}
          </div>
        </div>
      </div>
      {% endblock %}
    </main>
    <footer class="l-footer--sticky p-strip is-dark is-shallow" role="contentinfo">
      <div class="row">
        <a class="is-dark" href="https://github.com/mr-cal/craft-dashboard">craft-dashboard</a>
        <a class="is-dark" href="/admin">Admin</a>
      </div>
    </footer>
    <div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="false"></div>
    <script>
      (function () {
        var storageKey = "theme";
        var themeToggle = document.getElementById("theme-toggle");
        var root = document.documentElement;
        var systemPreference = window.matchMedia("(prefers-color-scheme: dark)");
        var toastContainer = document.getElementById("toast-container");

        function getTheme() {
          var storedTheme = window.localStorage.getItem(storageKey);
          if (storedTheme === "dark" || storedTheme === "light") {
            return storedTheme;
          }
          return systemPreference.matches ? "dark" : "light";
        }

        function applyTheme(theme) {
          var isDarkTheme = theme === "dark";
          root.classList.toggle("is-dark-theme", isDarkTheme);
          root.dataset.theme = theme;
          if (!themeToggle) {
            return;
          }
          themeToggle.setAttribute("aria-pressed", String(isDarkTheme));
          themeToggle.setAttribute(
            "aria-label",
            isDarkTheme ? "Switch to light theme" : "Switch to dark theme"
          );
        }

        function dismissToast(toast) {
          if (!toast) {
            return;
          }
          toast.classList.add("is-hiding");
          window.setTimeout(function () {
            toast.remove();
          }, 180);
        }

        function showToast(message, type) {
          if (!toastContainer || !message) {
            return;
          }

          var toastType = type || "info";
          var toast = document.createElement("div");
          var closeButton = document.createElement("button");
          var text = document.createElement("span");
          var timeoutMs = toastType === "error" ? 8000 : 3000;

          toast.className = "toast toast--" + toastType;
          text.textContent = message;
          closeButton.type = "button";
          closeButton.className = "toast__close";
          closeButton.setAttribute("aria-label", "Dismiss notification");
          closeButton.innerHTML = "&times;";
          closeButton.addEventListener("click", function () {
            dismissToast(toast);
          });

          toast.appendChild(text);
          toast.appendChild(closeButton);
          toastContainer.appendChild(toast);

          window.setTimeout(function () {
            dismissToast(toast);
          }, timeoutMs);
        }

        function dispatchHxTriggers(response) {
          if (!response || !response.headers) {
            return;
          }

          var triggerHeader = response.headers.get("HX-Trigger");
          if (!triggerHeader) {
            return;
          }

          try {
            var triggers = JSON.parse(triggerHeader);
            Object.keys(triggers).forEach(function (eventName) {
              document.body.dispatchEvent(
                new CustomEvent(eventName, { detail: triggers[eventName] })
              );
            });
          } catch (error) {
            console.error(error);
          }
        }

        function pad2(value) {
          return String(value).padStart(2, "0");
        }

        // Canonical timestamp format for the whole site: "YYYY-MM-DD HH:MM AM/PM",
        // rendered in the viewer's local timezone.
        function formatLocalDateTime(date) {
          var hours = date.getHours();
          var ampm = hours >= 12 ? "PM" : "AM";
          var hour12 = hours % 12 || 12;
          return (
            date.getFullYear() +
            "-" +
            pad2(date.getMonth() + 1) +
            "-" +
            pad2(date.getDate()) +
            " " +
            pad2(hour12) +
            ":" +
            pad2(date.getMinutes()) +
            " " +
            ampm
          );
        }

        function upgradeLocalTimes(root) {
          (root || document)
            .querySelectorAll("time.local-time[datetime]")
            .forEach(function (element) {
              var date = new Date(element.getAttribute("datetime"));
              if (!Number.isNaN(date.getTime())) {
                element.textContent = formatLocalDateTime(date);
              }
            });
        }

        function formatStatusTimestamp(value) {
          if (!value) {
            return "Never";
          }

          var date = new Date(value);
          if (Number.isNaN(date.getTime())) {
            return value;
          }

          return formatLocalDateTime(date);
        }

        function updateStatusIndicator(kind, running) {
          document
            .querySelectorAll('[data-system-status-kind="' + kind + '"]')
            .forEach(function (element) {
              var dot = element.querySelector(".system-status-dot");
              var statusText = running ? "running" : "idle";
              if (dot) {
                dot.classList.toggle("is-running", running);
              }
              element.setAttribute(
                "title",
                kind.charAt(0).toUpperCase() + kind.slice(1) + " " + statusText
              );
            });
        }

        function updateStatusValue(key, value) {
          document
            .querySelectorAll('[data-system-status-value="' + key + '"]')
            .forEach(function (element) {
              element.textContent = formatStatusTimestamp(value);
            });
        }

        function applySystemStatus(payload) {
          if (!payload) {
            return;
          }

          updateStatusIndicator("collection", Boolean(payload.collection_running));
          updateStatusIndicator("evaluation", Boolean(payload.evaluation_running));
          updateStatusValue("last_collection", payload.last_collection);
          updateStatusValue("last_evaluation", payload.last_evaluation);
        }

        window.showToast = showToast;
        window.dispatchHxTriggers = dispatchHxTriggers;
        window.applySystemStatus = applySystemStatus;
        window.upgradeLocalTimes = upgradeLocalTimes;

        applyTheme(getTheme());
        upgradeLocalTimes(document);

        if (themeToggle) {
          themeToggle.addEventListener("click", function () {
            var nextTheme = root.classList.contains("is-dark-theme") ? "light" : "dark";
            window.localStorage.setItem(storageKey, nextTheme);
            applyTheme(nextTheme);
          });
        }

        if (systemPreference.addEventListener) {
          systemPreference.addEventListener("change", function (event) {
            if (window.localStorage.getItem(storageKey)) {
              return;
            }
            applyTheme(event.matches ? "dark" : "light");
          });
        }

        document.body.addEventListener("toast", function (event) {
          var detail = event.detail || {};
          showToast(detail.message, detail.type);
        });

        document.body.addEventListener("htmx:afterRequest", function (event) {
          var element = event.detail.elt;
          if (!element || !element.hasAttribute("data-system-status-poller")) {
            return;
          }

          try {
            applySystemStatus(JSON.parse(event.detail.xhr.responseText || "{}"));
          } catch (error) {
            console.error(error);
          }
        });

        document.body.addEventListener("htmx:afterSwap", function (event) {
          upgradeLocalTimes(event.detail && event.detail.elt ? event.detail.elt : document);
        });

        document.body.addEventListener("htmx:responseError", function(event) {
          var status = event.detail.xhr ? event.detail.xhr.status : 0;
          showToast(
            "Request failed" + (status ? " (" + status + ")" : "") + ". Please try again.",
            "error"
          );
        });
        document.body.addEventListener("htmx:sendError", function() {
          showToast("Network error. Check your connection and try again.", "error");
        });
      })();
    </script>
    {% block scripts %}{% endblock %}
  </body>
</html>
