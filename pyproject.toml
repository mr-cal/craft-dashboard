[project]
name = "craft-dashboard"
description = "Dashboard, insights, and issue triage for *craft applications and libraries."
dynamic = ["version"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "gunicorn>=23.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.8",
    "pydantic-settings>=2.6",
    "jinja2>=3.1",
    "httpx>=0.28",
    "tenacity>=0.29",
    "pygithub>=2.3",
    "launchpadlib>=2.0",
    "click>=8.1",
    "python-multipart>=0.0.18",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: GNU General Public License (GPL)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.12"
readme = { file = "README.md", content-type = "text/markdown" }

[project.scripts]
craft-dashboard = "craft_dashboard.cli:main"

[dependency-groups]
lint = [
    "ruff>=0.9",
]
types = [
    "ty>=0.0.1a6",
]
dev = [
    "coverage[toml]~=7.4",
    "pytest~=8.3",
    "pytest-asyncio~=0.25",
    "pytest-cov~=7.0",
    "pytest-mock~=3.12",
    "httpx",
    "aiosqlite>=0.22.1",
    "ruff>=0.15.13",
]

[build-system]
requires = [
    "setuptools>=69.0",
    "setuptools_scm[toml]>=7.1",
]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
write_to = "craft_dashboard/_version.py"
version_scheme = "post-release"
git_describe_command = [
    "git",
    "describe",
    "--dirty",
    "--long",
    "--match",
    "[0-9]*.[0-9]*.[0-9]*",
    "--exclude",
    "*[^0-9.]*",
]

[tool.setuptools.packages.find]
include = ["craft_dashboard*"]
namespaces = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = "tests"
xfail_strict = true
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
omit = ["tests/**"]

[tool.coverage.report]
skip_empty = true
exclude_also = [
    "if (typing\\.)?TYPE_CHECKING:",
]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["craft_dashboard", "tests"]

[tool.ruff.lint]
select = [
    "F", "E", "W", "I", "N", "D", "UP", "YTT",
    "ANN", "ASYNC",
    "S101", "S102", "S103", "S108", "S104", "S105", "S106", "S107",
    "S110", "S113", "S3", "S5", "S602", "S701",
    "BLE", "FBT", "B0", "A", "COM", "C4", "T10",
    "ISC", "ICN", "INP",
    "PIE790", "PIE794", "PIE796", "PIE804", "PIE807", "PIE810",
    "PYI", "PT", "Q", "RSE", "RET", "SLF", "SIM", "TID",
    "TC001", "TC002", "TC003", "TC004", "TC005",
    "ARG", "PTH", "FIX", "ERA", "PGH", "PL", "TRY",
    "FLY", "PERF",
    "RUF001", "RUF002", "RUF003", "RUF005", "RUF008",
    "B035", "RUF013", "RUF100", "RUF200",
]
ignore = [
    "E501", "D105", "D107", "D203", "D213", "D215",
    "A003", "SIM117", "PLW1641", "COM812", "ISC001", "TRY003",
]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.pydocstyle]
ignore-decorators = [
    "typing.overload",
    "overrides.override",
    "overrides.overrides",
    "typing.override",
    "typing_extensions.override",
]

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.lint.per-file-ignores]
"tests/**.py" = [
    "D", "ANN", "ARG", "S101", "S103", "S108",
    "PLR0913", "PLR2004", "SLF",
]
"__init__.py" = ["I001", "F401"]
