---
- name: Install Nginx and Certbot
  ansible.builtin.apt:
    name:
      - nginx
      - certbot
      - python3-certbot-nginx
    state: present

- name: Remove default Nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload Nginx

- name: Deploy Nginx config (HTTP only initially for certbot)
  ansible.builtin.copy:
    dest: /etc/nginx/sites-available/craft-dashboard
    content: |
      server {
          listen 80;
          server_name {{ domain_name }};

          location / {
              proxy_pass http://127.0.0.1:{{ app_port }};
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
          }

          location /.well-known/acme-challenge/ {
              root /var/www/html;
          }
      }
    mode: "0644"
  notify: Reload Nginx

- name: Enable Nginx site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/craft-dashboard
    dest: /etc/nginx/sites-enabled/craft-dashboard
    state: link
  notify: Reload Nginx

- name: Ensure Nginx is running
  ansible.builtin.systemd:
    name: nginx
    state: started
    enabled: true

- name: Obtain SSL certificate (if not already present)
  ansible.builtin.shell: |
    certbot certonly --nginx \
      -d {{ domain_name }} \
      --non-interactive \
      --agree-tos \
      -m {{ nginx_ssl_email }}
  args:
    creates: /etc/letsencrypt/live/{{ domain_name }}/fullchain.pem
  tags: ssl

- name: Deploy full Nginx config with SSL
  ansible.builtin.template:
    src: craft-dashboard.conf.j2
    dest: /etc/nginx/sites-available/craft-dashboard
    mode: "0644"
  notify: Reload Nginx
  tags: ssl

- name: Set up certbot renewal cron
  ansible.builtin.cron:
    name: "certbot-renew"
    hour: "3"
    minute: "30"
    job: "certbot renew --quiet --post-hook 'systemctl reload nginx'"
  tags: ssl
