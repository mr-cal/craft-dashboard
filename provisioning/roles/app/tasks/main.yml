---
- name: Install uv system-wide
  ansible.builtin.shell: |
    curl -LsSf https://astral.sh/uv/install.sh | env UV_INSTALL_DIR=/usr/local/bin sh
  args:
    creates: /usr/local/bin/uv

- name: Allow git to operate on the app directory (safe.directory)
  ansible.builtin.shell: |
    git config --system --add safe.directory {{ app_dir }}
  changed_when: false

- name: Check if app is already cloned
  ansible.builtin.stat:
    path: "{{ app_dir }}/.git"
  register: app_git

- name: Clone application repo (first time)
  ansible.builtin.git:
    repo: "{{ app_repo }}"
    dest: "{{ app_dir }}"
    version: "{{ app_branch }}"
  when: not app_git.stat.exists
  notify: Restart craft-dashboard

- name: Update application repo (subsequent runs)
  ansible.builtin.git:
    repo: "{{ app_repo }}"
    dest: "{{ app_dir }}"
    version: "{{ app_branch }}"
    force: true
  when: app_git.stat.exists
  notify:
    - Restart craft-dashboard
    - Restart collect-data

- name: Set application directory ownership
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    recurse: true

- name: Create virtual environment
  ansible.builtin.shell: |
    /usr/local/bin/uv venv {{ app_venv }} --python {{ python_version }}
  args:
    creates: "{{ app_venv }}/bin/python"

- name: Install application dependencies
  ansible.builtin.shell: |
    /usr/local/bin/uv pip install --python {{ app_venv }}/bin/python -e "{{ app_dir }}" psycopg2-binary
  args:
    chdir: "{{ app_dir }}"
  changed_when: false
  notify:
    - Restart craft-dashboard
    - Restart collect-data

- name: Run database migrations
  ansible.builtin.shell: |
    {{ app_venv }}/bin/alembic upgrade head
  args:
    chdir: "{{ app_dir }}"
  environment: "{{ app_env }}"
  become: true
  become_user: "{{ app_user }}"
  changed_when: false

- name: Reset refresh schedules to trigger full data collection
  ansible.builtin.shell: |
    {{ app_venv }}/bin/python -c "
    from sqlalchemy import create_engine, text
    url = '{{ app_env.DATABASE_URL }}'.replace('+asyncpg', '')
    engine = create_engine(url)
    with engine.connect() as conn:
        conn.execute(text('DELETE FROM refresh_schedules'))
        conn.commit()
    print('Refresh schedules reset')
    "
  args:
    chdir: "{{ app_dir }}"
  become: true
  become_user: "{{ app_user }}"
  changed_when: false
  failed_when: false

- name: Run snapshot backfill in background (one-time)
  ansible.builtin.shell: |
    if [ ! -f {{ app_dir }}/.backfill_v3_done ]; then
      nohup {{ app_venv }}/bin/python scripts/backfill_snapshots.py \
        > /tmp/backfill.log 2>&1 &
      echo "Backfill started in background (PID $!)"
      touch {{ app_dir }}/.backfill_v3_done
    else
      echo "Backfill already completed, skipping"
    fi
  args:
    chdir: "{{ app_dir }}"
  environment: "{{ app_env }}"
  become: true
  become_user: "{{ app_user }}"
  changed_when: false

- name: Deploy environment file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ app_dir }}/.env"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0600"
  notify:
    - Restart craft-dashboard
    - Restart collect-data

- name: Deploy systemd service
  ansible.builtin.template:
    src: craft-dashboard.service.j2
    dest: /etc/systemd/system/craft-dashboard.service
    mode: "0644"
  notify:
    - Reload systemd
    - Restart craft-dashboard

- name: Enable and start craft-dashboard
  ansible.builtin.systemd:
    name: craft-dashboard
    state: started
    enabled: true
