# Application settings
app_name: craft-dashboard
app_user: craft-dashboard
app_group: craft-dashboard
app_dir: /opt/craft-dashboard
app_venv: /opt/craft-dashboard/.venv
app_repo: https://github.com/mr-cal/craft-dashboard.git
app_branch: main

# Python
python_version: "3.12"

# PostgreSQL
db_name: craft_dashboard
db_user: craft_dashboard
db_password: "{{ lookup('env', 'DB_PASSWORD') }}"

# Networking
domain_name: "{{ lookup('env', 'DOMAIN_NAME') | default('dashboard.example.com', true) }}"
app_port: 8000
nginx_ssl_email: "{{ lookup('env', 'SSL_EMAIL') | default('admin@example.com', true) }}"

# Environment variables written to /opt/craft-dashboard/.env on the server.
# Values come from provisioning/secrets.env via lookup('env', ...).
# Add new app settings here so they flow through Ansible rather than
# requiring manual edits on the server.
app_env:
  DATABASE_URL: "postgresql+asyncpg://{{ db_user }}:{{ db_password }}@localhost/{{ db_name }}"
  GITHUB_TOKEN: "{{ lookup('env', 'GITHUB_TOKEN') }}"
  OPENROUTER_API_KEY: "{{ lookup('env', 'OPENROUTER_API_KEY') }}"
  ADMIN_TOKEN: "{{ lookup('env', 'ADMIN_TOKEN') }}"
  LOG_LEVEL: "{{ lookup('env', 'LOG_LEVEL') | default('INFO', true) }}"
  LLM_BACKEND: "{{ lookup('env', 'LLM_BACKEND') | default('openrouter', true) }}"
  LOCAL_LLM_URL: "{{ lookup('env', 'LOCAL_LLM_URL') | default('http://localhost:11434/v1', true) }}"
  LOCAL_LLM_API_KEY: "{{ lookup('env', 'LOCAL_LLM_API_KEY') | default('', true) }}"
  LOCAL_LLM_SUMMARY_MODEL: "{{ lookup('env', 'LOCAL_LLM_SUMMARY_MODEL') | default('llama3.2', true) }}"
  LOCAL_LLM_EVALUATION_MODEL: "{{ lookup('env', 'LOCAL_LLM_EVALUATION_MODEL') | default('llama3.2', true) }}"

# Cron schedules (systemd timer OnCalendar format)
collect_schedule: "*-*-* 02:00:00"    # Daily at 2 AM UTC
llm_schedule: "*-*-* 06:00:00"       # Daily at 6 AM UTC (4 hours after collection)
