name: Collect Data

on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC
  workflow_dispatch:
    inputs:
      force_schedule:
        type: boolean
        description: "Force collection for all projects (ignore refresh schedule)"
        default: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger data collection
        env:
          ADMIN_TOKEN: ${{ secrets.CRAFT_DASHBOARD_ADMIN_TOKEN }}
          FORCE_SCHEDULE: ${{ inputs.force_schedule || false }}
        run: |
          BODY="{\"force_schedule\": ${FORCE_SCHEDULE}}"
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST https://craft-dashboard.name/admin/refresh \
            -H "Authorization: Bearer ${ADMIN_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$BODY")
          echo "Response: $RESPONSE"
          [ "$RESPONSE" = "202" ] || { echo "ERROR: expected 202, got $RESPONSE"; exit 1; }
